name: Host C++ tests

on:
  push:
    branches:
      - feature/vc-002-core-logic-reliability
      - feature/vc-004-monitoring-sms-policy
      - feature/vc-005-sim800l-transport
      - feature/vc-006b-logging-core
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run VC-002 logic tests
        run: |
          g++ -std=c++17 -Iinclude test/test_logic.cpp -o test_logic
          ./test_logic
      - name: Compile and run SMS policy tests
        run: |
          g++ -std=c++17 -Iinclude test/test_sms_policy.cpp -o test_sms_policy
          ./test_sms_policy
      - name: Compile and run SIM800L transport tests
        run: |
          g++ -std=c++17 -Iinclude test/test_sim800_transport.cpp -o test_sim800_transport
          ./test_sim800_transport
      - name: Compile and run logging core tests
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic -Iinclude test/test_logging.cpp -o test_logging
          ./test_logging
