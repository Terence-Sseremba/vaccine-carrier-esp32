[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  paulstoffregen/OneWire
  milesburton/DallasTemperature
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library
; IMPORTANT: This board setting is a provisional ESP32 DevKit assumption.
; Confirm actual ESP32 variant before compiling for real hardware.
